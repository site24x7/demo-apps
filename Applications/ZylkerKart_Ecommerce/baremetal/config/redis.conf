# =============================================================================
# ZylkerKart Redis Configuration
# =============================================================================
# Tuned for ZylkerKart microservices (session store + caching).
# Used by: storefront (sessions), product-service (cache),
#          order-service (cart), search-service (cache)
# =============================================================================

# ── Network ──────────────────────────────────────────────────────────────────
# Bind to all interfaces (restrict via firewall instead)
bind 0.0.0.0
port 6379

# ── Memory ───────────────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence ──────────────────────────────────────────────────────────────
# RDB snapshots (default schedule)
save 900 1
save 300 10
save 60 10000

dir /var/lib/redis
dbfilename zylkerkart-dump.rdb

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice

# ── Security ─────────────────────────────────────────────────────────────────
# Uncomment and set a password if needed:
# requirepass YourRedisPassword

# ── Performance ──────────────────────────────────────────────────────────────
tcp-backlog 511
timeout 0
tcp-keepalive 300
