server.port=8080
spring.application.name=banking-portal-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

services.ledger.url=http://localhost:8081
services.gateway.url=http://localhost:8082
services.ai.url=http://localhost:8083
services.internal-token=test-internal-token

chaos.enabled=false
management.endpoints.web.exposure.include=health
