# ─────────────────────────────────────────────────────────────
# ZylkerBank Banking Portal — Spring Boot Configuration
# ─────────────────────────────────────────────────────────────

server.port=8080
spring.application.name=banking-portal

# Forward headers for reverse proxy / load balancer
server.forward-headers-strategy=framework

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static assets mapping
spring.mvc.static-path-pattern=/assets/**
spring.web.resources.static-locations=classpath:/static/assets/

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:ZylkerBank@2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Session JDBC (uses pre-created tables in db/postgres/01-schema.sql)
spring.session.store-type=jdbc
spring.session.jdbc.table-name=spring_session
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=zylkerbank_session

# Backend Service Endpoints
services.ledger.url=${LEDGER_URL:http://localhost:8081}
services.gateway.url=${GATEWAY_URL:http://localhost:8082}
services.ai.url=${AI_URL:http://localhost:8083}
services.internal-token=${INTERNAL_TOKEN:zylkerbank-internal-dev-token}

# Actuator Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Site24x7 Chaos SDK Configuration
chaos.enabled=${CHAOS_SDK_ENABLED:true}
chaos.app-name=${CHAOS_SDK_APP_NAME:banking-portal}
chaos.config-file=${CHAOS_SDK_CONFIG_DIR:/var/site24x7-labs/faults}/${CHAOS_SDK_APP_NAME:banking-portal}.json

# Disable static caching during development/demo
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
