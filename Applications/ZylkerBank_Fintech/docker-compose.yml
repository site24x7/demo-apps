# ─────────────────────────────────────────────────────────────────────────────
# ZylkerBank — Polyglot Microservices Banking Platform
# ─────────────────────────────────────────────────────────────────────────────
#   8000  API Gateway (Edge Router)  (Python 3.11 / FastAPI)    -> Edge ingress
#   8080  Banking Portal & BFF       (Java 17 / Spring Boot 3.2, Thymeleaf)
#   8081  Account & Ledger Service   (Go 1.26 / Gin)            -> Oracle 23c
#   8082  Financial Gateway Service  (Node.js 18 / Express)     -> Postgres + Kafka (producer)
#   8083  AI & Risk Intelligence     (Python 3.11 / FastAPI)    -> Postgres + Kafka (consumer)
#   1521  Oracle Database 23c Free   (schema BANKLEDGER)
#   5432  PostgreSQL 16              (bank_db)
#   9092  Apache Kafka (KRaft)       (host listener; containers use kafka:19092)
#
# Quick start:
#   docker compose up -d --build
# Login: desphixs@gmail.com / Password@123  (PIN 1234)
#
# ─────────────────────────────────────────────────────────────────────────────
# Site24x7 APM Insight Integration
# ────────────────────────────────
# Enable APM monitoring for all services via environment variables:
#
#   S247_APM_ENABLED=true S247_LICENSE_KEY=<your_key> docker compose --profile apm up -d
#
# Or add to .env file:
#   S247_APM_ENABLED=true
#   S247_LICENSE_KEY=your_license_key_here
#
# When S247_APM_ENABLED=false (default), services run without any APM overhead.
# ─────────────────────────────────────────────────────────────────────────────

x-chaos-env: &chaos-env
  CHAOS_SDK_ENABLED: ${CHAOS_SDK_ENABLED:-true}
  CHAOS_SDK_CONFIG_DIR: /var/site24x7-labs/faults

x-apm-env: &apm-env
  S247_APM_ENABLED: ${S247_APM_ENABLED:-false}
  S247_LICENSE_KEY: ${S247_LICENSE_KEY:-}

x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:-zylkerbank-dev-jwt-secret-please-change-0123456789}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-zylkerbank-internal-dev-token}

x-pg-env: &pg-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: bank_db
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:-ZylkerBank@2024}

services:
  # ── Data stores & messaging ──────────────────────────────────────────────
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: zylkerbank-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-ZylkerBank@2024}      # SYS / SYSTEM password
      APP_USER: BANKLEDGER
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-ZylkerBank@2024}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./db/oracle:/container-entrypoint-initdb.d:ro
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: zylkerbank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ZylkerBank@2024}
      POSTGRES_DB: bank_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: zylkerbank-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:latest
    container_name: zylkerbank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic bank.transfers.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic bank.cards.v1 --partitions 3 --replication-factor 1
    networks:
      - zylkerbank-network
    restart: "no"

  # ── 1. Account & Ledger Service (Go / Gin / Oracle) ──────────────────────
  #    APM: Site24x7 Go Agent (eBPF sidecar — see s247-go-apm-agent service below)
  ledger-service:
    build:
      context: ./services/ledger-service
      dockerfile: Dockerfile
      additional_contexts:
        chaos-libs: ../../chaos-libs
    container_name: zylkerbank-ledger
    ports:
      - "8081:8081"
    environment:
      <<: [*chaos-env, *secrets, *apm-env]
      PORT: "8081"
      ORACLE_HOST: oracle-db
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: BANKLEDGER
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-ZylkerBank@2024}
      CHAOS_SDK_APP_NAME: ledger-service
    volumes:
      - /var/site24x7-labs/faults:/var/site24x7-labs/faults
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── 2. Financial Gateway (Node / Express / Kafka producer) ───────────────
  #    APM: Site24x7 Node.js Agent (apminsight runtime injection)
  financial-gateway:
    build:
      context: ./services/financial-gateway
      dockerfile: Dockerfile
      additional_contexts:
        chaos-libs: ../../chaos-libs
    container_name: zylkerbank-gateway
    user: "0:0"
    ports:
      - "8082:8082"
    environment:
      <<: [*chaos-env, *secrets, *pg-env, *apm-env]
      PORT: "8082"
      KAFKA_BROKERS: kafka:19092
      LEDGER_URL: http://ledger-service:8081
      RISK_URL: http://ai-risk-service:8083
      CARD_ENCRYPTION_KEY: ${CARD_ENCRYPTION_KEY:-zylkerbank-dev-card-key-32-bytes!!}
      CHAOS_SDK_APP_NAME: financial-gateway
      APMINSIGHT_LICENSE_KEY: ${S247_LICENSE_KEY:-}
      APMINSIGHT_APP_NAME: ZylkerBank-FinancialGateway
      APMINSIGHT_APP_PORT: 8082
    command: ["/bin/sh", "-c", "
      if [ \"$$S247_APM_ENABLED\" = \"true\" ]; then
        echo '[Site24x7] APM enabled for Financial Gateway (Node.js)';
        npm install apminsight --silent 2>/dev/null;
        echo '[Site24x7] Node.js agent installed.';
        exec node -r apminsight src/app.js;
      else
        exec node src/app.js;
      fi
    "]
    volumes:
      - /var/site24x7-labs/faults:/var/site24x7-labs/faults
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger-service:
        condition: service_healthy
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── 3. AI & Risk Intelligence (Python / FastAPI / Kafka consumer) ────────
  #    APM: Site24x7 Python Agent (apminsight + S247DataExporter)
  ai-risk-service:
    build:
      context: ./services/ai-risk-service
      dockerfile: Dockerfile
      additional_contexts:
        chaos-libs: ../../chaos-libs
    container_name: zylkerbank-ai-risk
    user: "0:0"
    ports:
      - "8083:8083"
    environment:
      <<: [*chaos-env, *secrets, *pg-env, *apm-env]
      PORT: "8083"
      KAFKA_BROKERS: kafka:19092
      LEDGER_URL: http://ledger-service:8081
      GATEWAY_URL: http://financial-gateway:8082
      LLM_MODEL: ${LLM_MODEL:-ollama/llama3}
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:11434}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      CHAOS_SDK_APP_NAME: ai-risk-service
      APM_APP_NAME: ZylkerBank-AIRisk
    command: ["/bin/sh", "-c", "
      if [ \"$$S247_APM_ENABLED\" = \"true\" ]; then
        echo '[Site24x7] APM enabled for AI Risk Service (Python)';
        if [ ! -f /opt/S247DataExporter/bin/service.sh ]; then
          echo '[Site24x7] Installing S247DataExporter...';
          apt-get update -qq && apt-get install -y -qq wget procps unzip curl > /dev/null 2>&1;
          wget -q -O /tmp/InstallDataExporter.sh https://staticdownloads.site24x7.com/apminsight/S247DataExporter/linux/InstallDataExporter.sh;
          sh /tmp/InstallDataExporter.sh -root -nsvc;
          rm -f /tmp/InstallDataExporter.sh;
          echo '[Site24x7] S247DataExporter installed.';
        else
          echo '[Site24x7] S247DataExporter already cached.';
        fi;
        pip install -q apminsight 2>/dev/null;
        echo '[Site24x7] Python agent installed.';
        /opt/S247DataExporter/bin/service.sh start;
        exec apminsight-run uvicorn app.main:app --host 0.0.0.0 --port 8083;
      else
        exec uvicorn app.main:app --host 0.0.0.0 --port 8083;
      fi
    "]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/site24x7-labs/faults:/var/site24x7-labs/faults
      - s247_python_risk:/opt/S247DataExporter
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ── 4. Banking Portal & BFF (Java / Spring Boot / Thymeleaf) ─────────────
  #    APM: Site24x7 Java Agent (-javaagent dynamic download & injection)
  banking-portal:
    build:
      context: ./services/banking-portal
      dockerfile: Dockerfile
      additional_contexts:
        chaos-libs: ../../chaos-libs
    container_name: zylkerbank-portal
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      <<: [*chaos-env, *pg-env, *apm-env]
      SERVER_PORT: "8080"
      LEDGER_URL: http://ledger-service:8081
      GATEWAY_URL: http://financial-gateway:8082
      AI_URL: http://ai-risk-service:8083
      CHAOS_SDK_APP_NAME: banking-portal
    entrypoint: ["/bin/sh", "-c", "
      if [ \"$$S247_APM_ENABLED\" = \"true\" ]; then
        echo '[Site24x7] APM enabled for Banking Portal (Java)';
        if [ ! -f /opt/s247-agent/apminsight-javaagent.jar ]; then
          echo '[Site24x7] Downloading Java agent...';
          apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null 2>&1;
          mkdir -p /opt/s247-agent;
          wget -q -O /opt/s247-agent/apminsight-javaagent.zip https://staticdownloads.site24x7.in/apminsight/agents/apminsight-javaagent.zip;
          unzip -o -q /opt/s247-agent/apminsight-javaagent.zip -d /opt/s247-agent/;
          rm -f /opt/s247-agent/apminsight-javaagent.zip;
          echo '[Site24x7] Java agent installed.';
        else
          echo '[Site24x7] Java agent already cached.';
        fi;
        exec java -Xms256m -Xmx512m
          -javaagent:/opt/s247-agent/apminsight-javaagent.jar
          -Dapminsight.license.key=$$S247_LICENSE_KEY
          -Dapminsight.application.name=ZylkerBank-Portal
          -jar app.jar;
      else
        exec java -Xms256m -Xmx512m -jar app.jar;
      fi
    "]
    volumes:
      - /var/site24x7-labs/faults:/var/site24x7-labs/faults
      - s247_java_portal:/opt/s247-agent
    depends_on:
      postgres:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      financial-gateway:
        condition: service_healthy
      ai-risk-service:
        condition: service_healthy
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ── 5. API Gateway (Python / FastAPI / Edge Router) ──────────────────────
  #    APM: Site24x7 Python Agent (apminsight + S247DataExporter)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      additional_contexts:
        chaos-libs: ../../chaos-libs
    container_name: zylkerbank-api-gateway
    user: "0:0"
    ports:
      - "8000:8000"
    environment:
      <<: [*chaos-env, *apm-env]
      PORT: "8000"
      PORTAL_URL: http://banking-portal:8080
      LEDGER_URL: http://ledger-service:8081
      GATEWAY_URL: http://financial-gateway:8082
      AI_URL: http://ai-risk-service:8083
      CHAOS_SDK_APP_NAME: api-gateway
      APM_APP_NAME: ZylkerBank-APIGateway
    command: ["/bin/sh", "-c", "
      if [ \"$$S247_APM_ENABLED\" = \"true\" ]; then
        echo '[Site24x7] APM enabled for API Gateway (Python)';
        if [ ! -f /opt/S247DataExporter/bin/service.sh ]; then
          echo '[Site24x7] Installing S247DataExporter...';
          apt-get update -qq && apt-get install -y -qq wget procps unzip curl > /dev/null 2>&1;
          wget -q -O /tmp/InstallDataExporter.sh https://staticdownloads.site24x7.com/apminsight/S247DataExporter/linux/InstallDataExporter.sh;
          sh /tmp/InstallDataExporter.sh -root -nsvc;
          rm -f /tmp/InstallDataExporter.sh;
          echo '[Site24x7] S247DataExporter installed.';
        else
          echo '[Site24x7] S247DataExporter already cached.';
        fi;
        pip install -q apminsight 2>/dev/null;
        echo '[Site24x7] Python agent installed.';
        /opt/S247DataExporter/bin/service.sh start;
        exec apminsight-run uvicorn app.main:app --host 0.0.0.0 --port 8000;
      else
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000;
      fi
    "]
    volumes:
      - /var/site24x7-labs/faults:/var/site24x7-labs/faults
      - s247_python_gateway:/opt/S247DataExporter
    depends_on:
      banking-portal:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      financial-gateway:
        condition: service_healthy
      ai-risk-service:
        condition: service_healthy
    networks:
      - zylkerbank-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Site24x7 APM Sidecar ─────────────────────────────────────────────────
  # Go APM Agent — eBPF-based sidecar (monitors ledger-service)
  # Only starts when profile 'apm' is active; e.g.:
  #   docker compose --profile apm up -d
  s247-go-apm-agent:
    image: site24x7/apminsight-go-agent:latest
    container_name: zylkerbank-s247-go-apm
    privileged: true
    pid: host
    network_mode: "service:ledger-service"
    environment:
      S247_LICENSE_KEY: ${S247_LICENSE_KEY:-}
      GO_APPS: "ZylkerBank-Ledger=ledger-service:8081"
    profiles:
      - apm
    depends_on:
      ledger-service:
        condition: service_started
    restart: unless-stopped

volumes:
  oracle_data:
    driver: local
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  # Site24x7 APM agent cache volumes (persist across restarts)
  s247_java_portal:
    driver: local
  s247_python_risk:
    driver: local
  s247_python_gateway:
    driver: local

networks:
  zylkerbank-network:
    driver: bridge
    name: zylkerbank-network
