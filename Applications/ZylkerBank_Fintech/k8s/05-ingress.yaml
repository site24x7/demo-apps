apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zylkerbank-ingress
  namespace: zylkerbank
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # All public traffic enters through the API Gateway (Edge Ingress)
          # The API Gateway proxies web traffic to banking-portal:8080 and
          # API endpoints to ledger-service:8081, financial-gateway:8082, and ai-risk-service:8083.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
