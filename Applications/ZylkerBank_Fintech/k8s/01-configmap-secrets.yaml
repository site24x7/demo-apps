apiVersion: v1
kind: ConfigMap
metadata:
  name: zylkerbank-config
  namespace: zylkerbank
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "bank_db"
  DB_USER: "postgres"
  ORACLE_HOST: "oracle-db"
  ORACLE_PORT: "1521"
  ORACLE_SERVICE: "FREEPDB1"
  ORACLE_USER: "BANKLEDGER"
  KAFKA_BROKERS: "kafka:19092"
  KAFKA_TOPICS: "bank.transfers.v1,bank.cards.v1"
  PORTAL_URL: "http://banking-portal:8080"
  LEDGER_URL: "http://ledger-service:8081"
  GATEWAY_URL: "http://financial-gateway:8082"
  AI_URL: "http://ai-risk-service:8083"
  CHAOS_SDK_ENABLED: "true"
  CHAOS_SDK_CONFIG_DIR: "/var/site24x7-labs/faults"
  S247_APM_ENABLED: "false"
  LLM_MODEL: "ollama/llama3"
  LLM_API_BASE: "http://host.docker.internal:11434"
  LLM_FALLBACK_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: zylkerbank-secrets
  namespace: zylkerbank
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ZylkerBank@2024"
  ORACLE_PASSWORD: "ZylkerBank@2024"
  JWT_SECRET: "zylkerbank-dev-jwt-secret-please-change-0123456789"
  INTERNAL_TOKEN: "zylkerbank-internal-dev-token"
  CARD_ENCRYPTION_KEY: "zylkerbank-dev-card-key-32-bytes!!"
  S247_LICENSE_KEY: ""
